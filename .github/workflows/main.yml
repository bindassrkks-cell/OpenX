      # -------------------------------------------------------------
      # STEP 3: Push Complete Codebase to GitHub Repo
      # -------------------------------------------------------------
      - name: Commit & Push Full Projects to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add customer_app admin_app
          if ! git diff --cached --quiet; then
            echo "🚀 Pushing complete Meesho Customer App and Admin App..."
            git commit -m "feat: complete Meesho style customer app and admin app with telegram polling [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "✅ All project source code already up to date in repository."
          fi

      # -------------------------------------------------------------
      # STEP 4: Build Customer App APK & Dispatch to Telegram
      # -------------------------------------------------------------
      - name: Build Customer App APK
        run: |
          cd customer_app
          flutter pub get
          flutter build apk --release

      - name: Send Customer APK to Telegram
        env:
          BOT_TOKEN: "7663258345:AAFWanmBg6FD_DQTz2q9tkvHX-8M9vAWkUA"
          CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          TARGET_CHAT="$CHAT_ID"
          if [ -z "$TARGET_CHAT" ]; then
            TARGET_CHAT=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates" | jq -r '.result[-1].message.chat.id // .result[-1].my_chat_member.chat.id // empty')
          fi

          APK_FILE=$(find customer_app/build/app/outputs/flutter-apk -name "*release*.apk" | head -n 1)

          if [ -n "$TARGET_CHAT" ] && [ -n "$APK_FILE" ]; then
