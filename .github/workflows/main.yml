name: Production Build & Delivery Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # GitHub dashboard se manual trigger karne ke liye

jobs:
  # -------------------------------------------------------------
  # JOB 1: Test & Verify Admin Telegram Bot
  # -------------------------------------------------------------
  validate-bot:
    name: Verify Telegram Controller Bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin_bot

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './admin_bot/package-lock.json'

      - name: Install Bot Dependencies
        run: npm ci || npm install

      - name: Syntax Check Bot Script
        run: node -c admin_bot.js

  # -------------------------------------------------------------
  # JOB 2: Build Flutter APK & Send to Telegram
  # -------------------------------------------------------------
  build-customer-apk:
    name: Build & Deploy Customer App
    needs: validate-bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./customer_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os-:-:channel-:-:version-"

      # Firebase Google Services JSON Injector (from Base64 Secret)
      - name: Inject Firebase Configuration
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > android/app/google-services.json
            echo "✅ google-services.json successfully injected."
          else
            echo "⚠️ Warning: GOOGLE_SERVICES_JSON_BASE64 secret not found."
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release

      # GitHub Actions Artifacts me store karein
      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-release
          path: customer_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # Telegram par direct APK send karein
      - name: Deliver APK to Telegram Admin
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          CAPTION="🚀 *Naya Customer App Release!*
          
          📝 *Commit:* ${COMMIT_MSG}
          🔖 *Hash:* \`${COMMIT_SHA:0:7}\`
          ⏱️ *Branch:* \`${GITHUB_REF_NAME}\`"

          curl -v -F "chat_id=${TELEGRAM_CHAT_ID}" \
               -F "caption=${CAPTION}" \
               -F "parse_mode=Markdown" \
               -F "document=@${APK_PATH}" \
               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
