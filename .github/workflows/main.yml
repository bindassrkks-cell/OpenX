name: Production Build & Delivery Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-deliver:
    name: Build Customer App & Send to Telegram
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Locate or Initialize Flutter Project
        run: |
          # Check for any pubspec.yaml in repository
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" | head -n 1)

          if [ -n "$PUBSPEC_PATH" ]; then
            FLUTTER_DIR=$(dirname "$PUBSPEC_PATH")
            echo "✅ Found existing Flutter project at: $FLUTTER_DIR"
          else
            echo "⚠️ No pubspec.yaml found in repo! Initializing standard customer app..."
            flutter create --org com.store customer_app
            FLUTTER_DIR="customer_app"
          fi

          echo "FLUTTER_DIR=$FLUTTER_DIR" >> $GITHUB_ENV

      - name: Inject Configuration & Dependencies
        run: |
          cd $FLUTTER_DIR
          # Android build essentials setup
          mkdir -p android/app
          flutter pub get

      - name: Build Universal Release APK
        run: |
          cd $FLUTTER_DIR
          flutter build apk --release

      - name: Locate Output APK
        run: |
          APK_FILE=$(find $FLUTTER_DIR/build/app/outputs/flutter-apk -name "*release*.apk" | head -n 1)
          echo "RESOLVED_APK_PATH=$APK_FILE" >> $GITHUB_ENV
          echo "APK built at: $APK_FILE"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-apk
          path: ${{ env.RESOLVED_APK_PATH }}
          retention-days: 14

      - name: Dispatch APK to Telegram
        env:
          BOT_TOKEN: "7663258345:AAFWanmBg6FD_DQTz2q9tkvHX-8M9vAWkUA"
          CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$CHAT_ID" ]; then
            echo "⚠️ TELEGRAM_ADMIN_CHAT_ID secret not set in repo. Reading default update..."
            # Agar Chat ID nahi hai toh bot ke updates se latest chat ID fetch karne ki koshish karega
            CHAT_ID=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates" | jq -r '.result[-1].message.chat.id // empty')
          fi

          if [ -n "$CHAT_ID" ] && [ "$CHAT_ID" != "null" ]; then
            CAPTION="🚀 *Customer App APK Ready!*
            
            📝 *Commit:* ${COMMIT_MSG}
            📦 *Build:* Successful ✅"

            curl -v -F "chat_id=${CHAT_ID}" \
                 -F "caption=${CAPTION}" \
                 -F "parse_mode=Markdown" \
                 -F "document=@${RESOLVED_APK_PATH}" \
                 "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          else
            echo "❌ Chat ID nahi mili. Telegram bot ko apne account se pehle ek message bhejein ya TELEGRAM_ADMIN_CHAT_ID secret set karein."
          fi
