name: Build & Release Apps from Repo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APKs from Repo & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Engine (3.24.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # -------------------------------------------------------------
      # 1. BUILD CUSTOMER APP (Single DEX, ARM64 Optimized)
      # -------------------------------------------------------------
      - name: Build Customer App APK
        run: |
          if [ -d "customer_app" ]; then
            echo "📦 Building Customer App..."
            cd customer_app
            flutter pub get
            flutter build apk --release --target-platform android-arm64
            APK_PATH=$(find build/app/outputs/flutter-apk -name "*release*.apk" | head -n 1)
            cp "$APK_PATH" ../Meesho_Customer_App.apk
            cd ..
            echo "CUSTOMER_EXISTS=true" >> $GITHUB_ENV
          else
            echo "⚠️ customer_app folder nahi mila!"
            echo "CUSTOMER_EXISTS=false" >> $GITHUB_ENV
          fi

      # -------------------------------------------------------------
      # 2. BUILD ADMIN APP (Single DEX, ARM64 Optimized)
      # -------------------------------------------------------------
      - name: Build Admin App APK
        run: |
          if [ -d "admin_app" ]; then
            echo "📦 Building Admin App..."
            cd admin_app
            flutter pub get
            flutter build apk --release --target-platform android-arm64
            APK_PATH=$(find build/app/outputs/flutter-apk -name "*release*.apk" | head -n 1)
            cp "$APK_PATH" ../Store_Admin_App.apk
            cd ..
            echo "ADMIN_EXISTS=true" >> $GITHUB_ENV
          else
            echo "⚠️ admin_app folder nahi mila!"
            echo "ADMIN_EXISTS=false" >> $GITHUB_ENV
          fi

      # -------------------------------------------------------------
      # 3. CREATE GITHUB RELEASE TAG & ATTACH APKS
      # -------------------------------------------------------------
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Release v1.0.${{ github.run_number }} (Customer & Admin APKs)"
          body: |
            ### 🛍️ Meesho Store Production Release

            Repo se fresh build kiye gaye Single-DEX APKs ready hain:
            - **Meesho_Customer_App.apk**: Customer Shopping App (Dark Theme, Firebase RTDB, UPI QR)
            - **Store_Admin_App.apk**: Store Controller (Live Telegram Polling & Order Approvals)
          files: |
            Meesho_Customer_App.apk
            Store_Admin_App.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------
      # 4. SEND BOTH APKS DIRECTLY TO TELEGRAM
      # -------------------------------------------------------------
      - name: Send APKs to Telegram
        env:
          BOT_TOKEN: "7663258345:AAFWanmBg6FD_DQTz2q9tkvHX-8M9vAWkUA"
          CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          TARGET="$CHAT_ID"
          if [ -z "$TARGET" ]; then
            TARGET=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates" | jq -r '.result[-1].message.chat.id // .result[-1].my_chat_member.chat.id // empty')
          fi

          if [ -n "$TARGET" ] && [ "$TARGET" != "null" ]; then
            if [ "$CUSTOMER_EXISTS" = "true" ] && [ -f "Meesho_Customer_App.apk" ]; then
              curl -F "chat_id=${TARGET}" \
                   -F "caption=🛍️ *Meesho Customer App APK (Single DEX)* ✅" \
                   -F "parse_mode=Markdown" \
                   -F "document=@Meesho_Customer_App.apk" \
                   "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
            fi

            if [ "$ADMIN_EXISTS" = "true" ] && [ -f "Store_Admin_App.apk" ]; then
              curl -F "chat_id=${TARGET}" \
                   -F "caption=👑 *Store Admin App APK (Single DEX + Poller)* ✅" \
                   -F "parse_mode=Markdown" \
                   -F "document=@Store_Admin_App.apk" \
                   "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
            fi
          else
            echo "⚠️ Telegram Chat ID nahi mili! Bot ko pehle ek baar Telegram par '/start' bhej dein."
          fi
